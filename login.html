<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Backoffice | Rabbit Head Blog</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="imgs/logo.png" alt="Rabbit Head" style="max-height: 70px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Início</a>
                    <a class="nav-link" href="sobre-nos.html">Sobre Nós</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Cabeçalho -->
    <header class="bg-success text-white text-center py-4">
        <div class="container">
            <h1 class="display-5">Backoffice - Área Administrativa</h1>
        </div>
    </header>

    <!-- Formulário de Login -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill text-success" style="font-size: 3rem;"></i>
                            <h2 class="mt-3 mb-1">Login</h2>
                            <p class="text-muted">Aceda à área administrativa</p>
                        </div>
                        
                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person-fill me-2"></i>Utilizador
                                </label>
                                <input type="text" class="form-control" id="username" placeholder="Introduza o seu utilizador" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock-fill me-2"></i>Palavra-passe
                                </label>
                                <input type="password" class="form-control" id="password" placeholder="Introduza a sua palavra-passe" required>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">
                                    Lembrar-me
                                </label>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                                </button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="index.html" class="text-decoration-none text-muted">
                                <i class="bi bi-arrow-left me-1"></i>Voltar ao site
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-5">
        <div class="container">
            <div class="d-flex flex-column flex-md-row align-items-center">
                <div class="mb-2 mb-md-0 flex-md-fill text-md-start">
                    <a href="index.html" class="text-white text-decoration-none me-3">Início</a>
                    <a href="sobre-nos.html" class="text-white text-decoration-none me-3">Sobre Nós</a>
                    <a href="https://github.com/vascofcoelho" target="_blank" class="text-white text-decoration-none">GitHub</a>
                </div>
                <div class="mb-2 mb-md-0 flex-md-fill text-center">
                    <span>Rabbit Head Blog &copy; 2025</span>
                </div>
                <div class="flex-md-fill text-md-end">
                    <a href="login.html" class="text-white text-decoration-none">Admin</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
